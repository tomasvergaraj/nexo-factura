name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unitarios + integracion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Diagnostico: si la version de API del daemon no cubre docker.api.version
      # (ver el comentario del maven-failsafe-plugin en backend/pom.xml),
      # Testcontainers falla con "Could not find a valid Docker environment".
      - name: Version de Docker del runner
        run: docker version --format 'Server {{.Server.Version}} — API {{.Server.APIVersion}} (min {{.Server.MinAPIVersion}})'

      # verify = unitarios (surefire) + los *IT con Testcontainers (failsafe).
      # El runner de Ubuntu trae daemon Docker, asi que PostgreSQL levanta de verdad.
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify

      - name: Publicar reportes de test
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reportes-test-backend
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # El script build ya es "tsc && vite build": type-check y bundle en un paso.
      - name: npm run build
        working-directory: frontend
        run: npm run build
